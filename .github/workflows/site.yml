name: Site

# The website under site/. The Rust workflows ignore site/; this one also
# watches the markdown that scripts/sync-docs.mjs turns into /docs, since
# a renamed heading there fails the site build.
on:
  push:
    branches: [main]
    paths: &site-paths
      - "site/**"
      - "README.md"
      - "docs/**"
      - "rubygem/*/README.md"
      - ".github/workflows/site.yml"
  pull_request:
    paths: *site-paths

permissions:
  contents: read

# Whole runs queue per ref, so build and deploy of one push finish before
# the next push's run starts, and an older build can never deploy after a
# newer one. On main a run in progress is never cancelled (it may be
# mid-upload); a waiting run is replaced by a newer push, which is fine
# because the newest commit contains it. Pull request runs just cancel.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          # Astro 7 requires Node >= 22.12.
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      # Parses wrangler.jsonc and packages dist/ the way a deploy would,
      # without credentials, so a bad route or asset option fails here.
      - run: npx wrangler deploy --dry-run

  # The latest push to main that touches the site ships it. The token lives in
  # the `production` environment, whose deployment branch policy admits
  # main only, so no PR run (and no workflow edited in a PR) can read it.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://oximg.dev
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
