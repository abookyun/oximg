name: Site

# The website under site/. The Rust workflows ignore site/; this one also
# watches the markdown that scripts/sync-docs.mjs turns into /docs, since
# a renamed heading there fails the site build.
on:
  push:
    branches: [main]
    paths: &site-paths
      - "site/**"
      - "README.md"
      - "docs/**"
      - "rubygem/*/README.md"
      - ".github/workflows/site.yml"
  pull_request:
    paths: *site-paths

permissions:
  contents: read

# Pull request runs only build and dry-run; deploys come from Cloudflare
# Workers Builds, which watches main itself. A newer push to a PR cancels
# the older run.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          # Astro 7 requires Node >= 22.12.
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      # Parses wrangler.jsonc and packages dist/ the way a deploy would,
      # without credentials, so a bad route or asset option fails here.
      - run: npx wrangler deploy --dry-run
