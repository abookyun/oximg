name: Site

# The website under site/. The Rust workflows ignore site/; this one also
# watches the markdown that scripts/sync-docs.mjs turns into /docs, since
# a renamed heading there fails the site build.
on:
  push:
    branches: [main]
    paths: &site-paths
      - "site/**"
      - "README.md"
      - "docs/**"
      - "rubygem/*/README.md"
      - ".github/workflows/site.yml"
  pull_request:
    paths: *site-paths

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          # Astro 7 requires Node >= 22.12.
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      # Parses wrangler.jsonc and packages dist/ the way a deploy would,
      # without credentials, so a bad route or asset option fails here.
      - run: npx wrangler deploy --dry-run

  # Every push to main that touches the site ships it. The token lives in
  # the `production` environment, whose deployment branch policy admits
  # main only, so no PR run (and no workflow edited in a PR) can read it.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://oximg.dev
    # One deploy at a time, in push order; never cancel one mid-upload.
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
